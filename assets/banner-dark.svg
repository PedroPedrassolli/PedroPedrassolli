<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Pedro Pedrassolli, full-stack Ruby on Rails developer</title>
  <desc id="descricao">I turn messy business rules into code that is clear, tested, and easy to change. Boring code is a compliment.</desc>
  <style>.sans{font-family:Geist, Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif}.mono{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.cursor{animation:piscar 1.1s steps(1) infinite}@keyframes piscar{50%{opacity:0}}@media (prefers-reduced-motion:reduce){.cursor{animation:none}}</style>
  <defs><linearGradient id="marca" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9a1ff"/><stop offset="1" stop-color="#ff8fb1"/></linearGradient><linearGradient id="nome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b8b8cc"/></linearGradient></defs>
  <defs>
    <clipPath id="banner-corte"><rect width="1200" height="400" rx="24"/></clipPath>
    <pattern id="banner-grade" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.05)"/>
    </pattern>
    <radialGradient id="banner-luz1" cx="0.12" cy="0" r="0.75">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="banner-luz2" cx="0.95" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#ff6b96" stop-opacity="0.21"/>
      <stop offset="1" stop-color="#ff6b96" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#banner-corte)">
    <rect width="1200" height="400" fill="#09090f"/>
    <rect width="1200" height="400" fill="url(#banner-grade)"/>
    <rect width="1200" height="400" fill="url(#banner-luz1)"/>
    <rect width="1200" height="400" fill="url(#banner-luz2)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="23.5" fill="none" stroke="rgba(255,255,255,0.08)"/>

  <!-- Marca "pp" e o que estou fazendo agora -->
  <rect x="56" y="52" width="36" height="36" rx="9" fill="url(#marca)"/>
  <text x="74" y="76" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#09090f">pp</text>
  <rect x="104.5" y="52.5" width="476" height="35" rx="17.5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="123" cy="70" r="4.5" fill="#4ade80"/>
  <text x="136" y="75.5" class="sans" font-size="15" fill="#a3a3b8" textLength="426" lengthAdjust="spacing">At Emotta Sistemas, migrating an xHarbour system to Rails</text>

  <!-- Nome, cargo e frase, como no topo do portfólio -->
  <text x="54" y="166" class="sans" font-size="62" font-weight="700" letter-spacing="-1.5" fill="url(#nome)">Pedro</text>
  <text x="54" y="232" class="sans" font-size="62" font-weight="700" letter-spacing="-1.5" fill="url(#nome)">Pedrassolli</text>
  <text x="56" y="278" class="sans" font-size="22" font-weight="600" fill="#b9a1ff">Full-stack Ruby on Rails developer</text>
  <text x="56" y="318" class="sans" font-size="18" fill="#a3a3b8">I turn messy business rules into code that is</text>
  <text x="56" y="343" class="sans" font-size="18" fill="#a3a3b8">clear, tested, and easy to change.</text>
  <text x="56" y="368" class="sans" font-size="18" fill="#a3a3b8">Boring code is a compliment.</text>

  <!-- Janela de código: o mesmo teste em RSpec do portfólio -->
  <g transform="translate(620 36)">
    <rect width="532" height="328" rx="14" fill="#0d0d16" stroke="rgba(255,255,255,0.10)"/>
    <circle cx="22" cy="21" r="5" fill="#ffffff" fill-opacity="0.16"/>
    <circle cx="40" cy="21" r="5" fill="#ffffff" fill-opacity="0.16"/>
    <circle cx="58" cy="21" r="5" fill="#ffffff" fill-opacity="0.16"/>
    <text x="80" y="26" class="mono" font-size="12.5" fill="#8f8fab">spec/pedro_spec.rb</text>
    <path d="M0 44H532" stroke="rgba(255,255,255,0.10)"/>
    <text x="24" y="76.0" class="mono" font-size="15" xml:space="preserve"><tspan fill="#ff79c6">RSpec</tspan><tspan fill="#e6e6f0">.describe </tspan><tspan fill="#8be9fd">Pedro</tspan><tspan fill="#ff79c6"> do</tspan></text>
    <text x="24" y="96.5" class="mono" font-size="15" xml:space="preserve"><tspan fill="#e6e6f0">  it </tspan><tspan fill="#f1fa8c">"keeps the business rule clear"</tspan><tspan fill="#ff79c6"> do</tspan></text>
    <text x="24" y="117.0" class="mono" font-size="15" xml:space="preserve"><tspan fill="#e6e6f0">    expect(pedro.code).to be_readable</tspan></text>
    <text x="24" y="137.5" class="mono" font-size="15" xml:space="preserve"><tspan fill="#ff79c6">  end</tspan></text>
    <text x="24" y="158.0" class="mono" font-size="15" xml:space="preserve"><tspan fill="#e6e6f0">  it </tspan><tspan fill="#f1fa8c">"tests the weird cases"</tspan><tspan fill="#ff79c6"> do</tspan></text>
    <text x="24" y="178.5" class="mono" font-size="15" xml:space="preserve"><tspan fill="#e6e6f0">    expect(pedro.specs).to cover(</tspan><tspan fill="#bd93f9">:edge_cases</tspan><tspan fill="#e6e6f0">)</tspan></text>
    <text x="24" y="199.0" class="mono" font-size="15" xml:space="preserve"><tspan fill="#ff79c6">  end</tspan></text>
    <text x="24" y="219.5" class="mono" font-size="15" xml:space="preserve"><tspan fill="#e6e6f0">  it </tspan><tspan fill="#f1fa8c">"prefers less magic"</tspan><tspan fill="#ff79c6"> do</tspan></text>
    <text x="24" y="240.0" class="mono" font-size="15" xml:space="preserve"><tspan fill="#e6e6f0">    expect(pedro.magic).to be &lt; pedro.clarity</tspan></text>
    <text x="24" y="260.5" class="mono" font-size="15" xml:space="preserve"><tspan fill="#ff79c6">  end</tspan></text>
    <text x="24" y="281.0" class="mono" font-size="15" xml:space="preserve"><tspan fill="#ff79c6">end</tspan></text>
    <path d="M0 294H532" stroke="rgba(255,255,255,0.10)"/>
    <text x="24" y="317" class="mono" font-size="14" xml:space="preserve"><tspan fill="#8f8fab">$ bundle exec rspec</tspan><tspan fill="#50fa7b">   ✓ 3 examples, 0 failures</tspan></text>
    <rect class="cursor" x="418" y="305" width="8.5" height="16" fill="#e6e6f0"/>
  </g>
</svg>
