<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">br_validators</title>
  <desc id="descricao">Validates and formats Brazilian documents: CPF, alphanumeric CNPJ, CNS, Pix, boletos, CEP, plates and more. No runtime dependencies.</desc>
  <style>.sans{font-family:Geist, Inter, 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif}.mono{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}.cursor{animation:piscar 1.1s steps(1) infinite}@keyframes piscar{50%{opacity:0}}@media (prefers-reduced-motion:reduce){.cursor{animation:none}}</style>
  <defs><linearGradient id="brv-marca" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d28d9"/><stop offset="1" stop-color="#d6205b"/></linearGradient></defs>
  <defs>
    <clipPath id="brv-corte"><rect width="600" height="330" rx="18"/></clipPath>
    <pattern id="brv-grade" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(10,10,30,0.05)"/>
    </pattern>
    <radialGradient id="brv-luz1" cx="0.12" cy="0" r="0.75">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="brv-luz2" cx="0.95" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#fb7aa5" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fb7aa5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#brv-corte)">
    <rect width="600" height="330" fill="#ffffff"/>
    <rect width="600" height="330" fill="url(#brv-grade)"/>
    <rect width="600" height="330" fill="url(#brv-luz1)"/>
    <rect width="600" height="330" fill="url(#brv-luz2)"/>
  </g>
  <rect x="0.5" y="0.5" width="599" height="329" rx="17.5" fill="none" stroke="rgba(10,10,30,0.10)"/>
  <text x="32" y="46" class="mono" font-size="13.5" fill="#6d28d9">github.com/PedroPedrassolli/br_validators  ↗</text>
  <text x="32" y="90" class="sans" font-size="30" font-weight="700" letter-spacing="-0.5" fill="#0f0f1a">br_validators</text>
  <text x="32" y="126" class="sans" font-size="18" fill="#4f4f63">Validates and formats Brazilian documents:</text>
  <text x="32" y="152" class="sans" font-size="18" fill="#4f4f63">CPF, alphanumeric CNPJ, CNS, Pix, boletos,</text>
  <text x="32" y="178" class="sans" font-size="18" fill="#4f4f63">CEP, plates and more. No runtime dependencies.</text>
  <rect x="32" y="212" width="58" height="28" rx="14" fill="rgba(109,40,217,0.07)" stroke="rgba(109,40,217,0.30)"/><text x="60.8" y="231" text-anchor="middle" class="mono" font-size="14" fill="#6d28d9">Ruby</text>
  <rect x="97.6" y="212" width="49" height="28" rx="14" fill="rgba(109,40,217,0.07)" stroke="rgba(109,40,217,0.30)"/><text x="122.2" y="231" text-anchor="middle" class="mono" font-size="14" fill="#6d28d9">gem</text>
  <rect x="154.8" y="212" width="133" height="28" rx="14" fill="rgba(109,40,217,0.07)" stroke="rgba(109,40,217,0.30)"/><text x="221.4" y="231" text-anchor="middle" class="mono" font-size="14" fill="#6d28d9">100% coverage</text>
  <text x="32" y="302" class="mono" font-size="14" xml:space="preserve"><tspan fill="#66667a">$ </tspan><tspan fill="#0f0f1a">gem install br_validators</tspan></text>
</svg>
